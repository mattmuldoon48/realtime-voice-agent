[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "realtime-voice-agent"
version = "0.1.0"
description = "Secure real-time Twilio-to-Amazon-Nova voice agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-sdk-bedrock-runtime>=0.8.0,<0.9",
    "boto3>=1.43.63,<2",
    "fastapi>=0.141.1,<0.142",
    "pyaudio>=0.2.14,<0.3",
    "pydantic-settings>=2.14.2,<3",
    "python-multipart>=0.0.32,<0.0.33",
    "structlog>=26.1.0,<27",
    "twilio>=9.10.9,<10",
    "uvicorn[standard]>=0.52.1,<0.53",
]

[dependency-groups]
dev = [
    "aws-cdk-lib>=2.263.0,<2.264",
    "constructs>=10.8.1,<10.9",
    "httpx>=0.28.1,<0.29",
    "mypy>=2.3.0,<2.4",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.16.1,<0.17",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
