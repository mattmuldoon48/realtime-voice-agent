<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" role="img" aria-labelledby="title desc">
  <title id="title">Telephone to voice model technical plate</title>
  <desc id="desc">A line-drawn telephone sends a waveform through an authenticated stream into a speech model.</desc>
  <defs>
    <filter id="ink" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence baseFrequency="0.018" numOctaves="2" seed="17" type="fractalNoise" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.65" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 0v8" stroke="#355344" stroke-width="1" opacity=".18"/>
    </pattern>
  </defs>

  <rect x="18" y="18" width="744" height="584" fill="#e9dfc5" stroke="#2b3f34" stroke-width="2"/>
  <rect x="28" y="28" width="724" height="564" fill="none" stroke="#2b3f34" stroke-width="1" stroke-dasharray="3 5" opacity=".5"/>

  <g fill="#283b31" font-family="Courier New, monospace">
    <text x="50" y="64" font-size="12" letter-spacing="2">VOICE SYSTEMS / PLATE A</text>
    <text x="730" y="64" text-anchor="end" font-size="10" letter-spacing="1.5">LIVE ROUTE · REV. 04</text>
  </g>
  <path d="M50 78h680" stroke="#2b3f34" stroke-width="1"/>

  <g filter="url(#ink)" stroke="#243b30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M116 355c12-63 34-107 69-132l29 28c-18 21-31 47-38 81h174c-7-34-20-60-38-81l29-28c35 25 57 69 69 132" fill="none" stroke-width="8"/>
    <path d="M138 356h250l31 119H107l31-119Z" fill="#dfd2b2" stroke-width="5"/>
    <path d="M160 350c8-38 28-64 57-78M366 350c-8-38-28-64-57-78" fill="none" stroke-width="3"/>
    <path d="M138 356h250l9 36H129l9-36Z" fill="url(#hatch)" stroke-width="3"/>
    <circle cx="263" cy="427" r="49" fill="#e9dfc5" stroke-width="4"/>
    <circle cx="263" cy="427" r="31" fill="none" stroke-width="3" stroke-dasharray="2 9"/>
    <circle cx="263" cy="427" r="8" fill="#a24f32" stroke-width="2"/>
    <path d="M172 206c-15-17-13-35 6-49l26-19c15-10 31-7 42 7l10 13h15l10-13c11-14 27-17 42-7l26 19c19 14 21 32 6 49l-26 29c-10 11-25 12-36 2l-13-12h-34l-13 12c-11 10-26 9-36-2l-25-29Z" fill="#d9caa8" stroke-width="6"/>
    <path d="M198 172c24 12 106 12 130 0" fill="none" stroke-width="2"/>
  </g>

  <g stroke="#a24f32" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M421 358h34l12-31 21 61 18-94 22 129 18-79 15 43 15-29h27" stroke-width="5"/>
    <path d="M612 358h46" stroke-width="3"/>
    <path d="m649 347 12 11-12 11" stroke-width="3"/>
  </g>

  <g transform="translate(671 357)" filter="url(#ink)">
    <circle r="54" fill="none" stroke="#243b30" stroke-width="4"/>
    <circle r="40" fill="none" stroke="#243b30" stroke-width="1.5" stroke-dasharray="4 5"/>
    <path d="M-17-4c5-19 28-20 35-5 5 12-1 25-14 29-10 3-22-3-24-14M-14-1c7 2 13 8 14 16M13-7c-4 4-7 10-7 17" fill="none" stroke="#243b30" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g fill="#283b31" font-family="Courier New, monospace">
    <text x="105" y="520" font-size="11" letter-spacing="1.8">01 / TELEPHONE INPUT</text>
    <text x="105" y="540" font-size="10">G.711 μ-law · mono · 8 kHz</text>
    <text x="456" y="457" font-size="10" letter-spacing="1.4">AUTHENTICATED</text>
    <text x="456" y="474" font-size="10" letter-spacing="1.4">MEDIA STREAM</text>
    <text x="612" y="446" font-size="11" letter-spacing="1.8">02 / NOVA</text>
    <text x="612" y="466" font-size="10">speech out · 24 kHz</text>
  </g>

  <g stroke="#2b3f34" fill="none" stroke-width="1">
    <path d="M139 493 93 525H52"/>
    <path d="M672 414v20h-70"/>
    <path d="M436 344v-58h105" stroke-dasharray="3 4"/>
  </g>
  <g fill="#283b31" font-family="Courier New, monospace" font-size="9" letter-spacing="1.2">
    <text x="546" y="289">FULL-DUPLEX PATH</text>
    <text x="50" y="578">NOT TO SCALE · SESSION STATE ISOLATED PER CALL · TRANSCRIPT CONTENT DISABLED FOR PUBLIC DEMO</text>
  </g>
</svg>
